<label class="staff-label" for="status-{{ assessment_id }}">Case status</label><select class="staff-input" name="status" id="status-{{ assessment_id }}"><option value="reviewed">Reviewed</option><option value="follow_up">Follow up</option><option value="resolved">Resolved review</option><option value="open">Reopen</option></select>
<label class="staff-label" for="assigned-{{ assessment_id }}">Assigned manager</label><select class="staff-input" id="assigned-{{ assessment_id }}" name="assigned_to"><option value="">Unassigned</option>{% for manager in exception_assignees %}<option value="{{ manager.pk }}"{% if current_review.assigned_to_id == manager.pk %} selected{% endif %}>{{ manager.get_full_name|default:manager.email }}</option>{% endfor %}</select>
<label class="staff-label" for="due-{{ assessment_id }}">Follow-up due</label><input type="date" class="staff-input" name="due_date" id="due-{{ assessment_id }}" value="{{ current_review.due_date|date:'Y-m-d' }}">
<label class="staff-label" for="note-{{ assessment_id }}">Assessment or resolution</label><textarea class="staff-input mb-3" name="note" id="note-{{ assessment_id }}" required maxlength="1000"></textarea><button type="submit" class="staff-btn staff-btn--primary">Save assessment</button>
