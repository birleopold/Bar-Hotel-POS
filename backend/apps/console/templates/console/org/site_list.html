{% extends "console/base.html" %}
{% block title %}Branches{% endblock %}
{% block content %}
  <div class="staff-toolbar">
    <h1 class="staff-page-title mb-0">Branches (sites)<span class="staff-page-title__accent" aria-hidden="true"></span></h1>
    <a class="staff-btn staff-btn--primary" href="{% url 'console-org-site-create' %}">New branch</a>
  </div>
  <div class="staff-table-wrap">
    <table class="staff-table">
      <thead><tr><th>Name</th><th>City</th><th></th></tr></thead>
      <tbody>
        {% for s in sites %}
          <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.city|default:"—" }}</td>
            <td>
              <a href="{% url 'console-org-site-edit' site_id=s.id %}">Edit</a>
              · <a href="{% url 'console-org-outlets' site_id=s.id %}">Sections</a>
            </td>
          </tr>
        {% empty %}
          <tr><td colspan="3" class="staff-muted">No branches yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
