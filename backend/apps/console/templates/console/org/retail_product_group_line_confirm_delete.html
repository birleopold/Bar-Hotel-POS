{% extends "console/base.html" %}
{% block title %}Remove group product{% endblock %}
{% block content %}
<section class="fizo-entity"><header class="fizo-entity__header"><div><p class="grocery-setup__eyebrow">Catalogue / {{ retail_group.name }}</p><h1>Remove product</h1></div></header>
<form method="post" class="staff-card">{% csrf_token %}<p>Remove <strong>{{ object.menu_item.name }}</strong> from <strong>{{ retail_group.name }}</strong>?</p><div class="d-flex gap-2"><button class="staff-btn staff-btn--primary" type="submit">Remove product</button><a class="staff-btn staff-btn--ghost" href="{% url 'console-org-retail-group-lines' retail_group.id %}">Cancel</a></div></form></section>
{% endblock %}
