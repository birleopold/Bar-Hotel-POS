  /api/v1/integrations/payment-webhook/:
    post:
      operationId: integrations_payment_webhook_create
      description: |-
        ``POST`` with JSON body containing at least **event_id**, **provider**, **status**.
        Requires header **X-Tenant-Id** and **X-Webhook-Secret** matching
        ``PAYMENT_WEBHOOK_SHARED_SECRET`` when that setting is non-empty.
        Idempotent per tenant + **event_id** (~30 days).
      parameters:
      - in: header
        name: X-Tenant-Id
        schema:
          type: string
          format: uuid
        required: true
      - in: header
        name: X-Webhook-Secret
        schema:
          type: string
        required: true
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
