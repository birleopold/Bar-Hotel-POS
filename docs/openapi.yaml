openapi: 3.0.3
info:
  title: Hotel & Bar Management API
  version: 0.1.0
  description: Tenant-scoped hospitality API. Authenticated calls use **Bearer** JWT.
    Send header **X-Tenant-Id** (tenant UUID) on tenant-scoped routes; omit on `/health/`,
    `/auth/token/`, `/auth/token/refresh/`, `/auth/password/reset/`, `/auth/password/reset/confirm/`,
    and `/invites/accept/`.
paths:
  /api/v1/audit-events/:
    get:
      operationId: audit_events_list
      tags:
      - audit-events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
          description: ''
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        description: Active tenant UUID. Required for most authenticated, tenant-scoped
          routes.
        schema:
          type: string
          format: uuid
  /api/v1/audit-events/{id}/:
    get:
      operationId: audit_events_retrieve
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        description: Active tenant UUID. Required for most authenticated, tenant-scoped
          routes.
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audit event.
        required: true
      tags:
      - audit-events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Request a reset email. Response is always the same to avoid account
        enumeration.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
