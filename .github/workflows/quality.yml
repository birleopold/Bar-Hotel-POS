name: Django quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: SQLite checks (not release certification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check read-only deployment preflight syntax
        run: |
          bash -n deployment/contabo/preflight.sh
          bash -n deployment/contabo/deploy-app.sh
          bash deployment/contabo/validate-config.sh

      - name: Verify tracked CSS dependencies and audit regressions
        run: |
          python -m unittest discover -s scripts -p 'test_audit_css_dependencies.py' -v
          python scripts/audit_css_dependencies.py > css-dependencies-current.json

      - name: Preserve tracked CSS audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-dependencies-${{ github.sha }}
          path: css-dependencies-current.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Check migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated test suite
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider --basetemp=.pytest-tmp --junitxml=pytest-results.xml

      - name: Preserve Django test results for cross-phase triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-sqlite-tests-${{ github.sha }}
          path: backend/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    name: PostgreSQL integration checks (not RLS role certification)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos_ci
          POSTGRES_PASSWORD: pos_ci_password
          POSTGRES_DB: pos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_ci -d pos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://pos_ci:pos_ci_password@127.0.0.1:5432/pos_ci
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run PostgreSQL integration and policy-presence checks
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider --basetemp=.pytest-pg-tmp tests/test_postgres_rls_policy_presence.py tests/test_postgres_settlement_concurrency.py
      - name: Verify retail quantity and return locks against real PostgreSQL
        working-directory: backend
        run: |
          python -m pytest -q -p no:cacheprovider --basetemp=.pytest-pg-retail-tmp \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_quantity_service_locks_nullable_product_line_without_outer_join \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_ajax_quantity_update_recalculates_due_after_partial_payment \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_closed_service_line_return_does_not_lock_nullable_product_join \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_retail_return_rejects_a_line_from_another_tenant \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_held_partial_basket_resume_reuses_original_order_and_tenders \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_customer_monitor_refuses_stale_held_basket_pointer \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_resume_rejected_for_completed_or_other_tenant_basket \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_held_sale_search_all_retail_outlets_recovers_older_basket \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_part_paid_receipt_identifies_balance_without_marking_sale_paid \
            tests/test_supermarket_cashier_lane.py::SupermarketCashierLaneTests::test_partial_cash_hold_resume_and_mixed_payment_closes_one_sale
