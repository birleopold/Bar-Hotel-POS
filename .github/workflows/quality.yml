name: Django quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: SQLite checks (not release certification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check read-only deployment preflight syntax
        run: |
          bash -n deployment/contabo/preflight.sh
          bash -n deployment/contabo/deploy-app.sh
          bash deployment/contabo/validate-config.sh

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Check migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated test suite
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider --basetemp=.pytest-tmp

  postgres:
    name: PostgreSQL integration checks (not RLS role certification)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos_ci
          POSTGRES_PASSWORD: pos_ci_password
          POSTGRES_DB: pos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_ci -d pos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://pos_ci:pos_ci_password@127.0.0.1:5432/pos_ci
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run PostgreSQL integration and policy-presence checks
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider --basetemp=.pytest-pg-tmp tests/test_postgres_rls_policy_presence.py tests/test_postgres_settlement_concurrency.py
